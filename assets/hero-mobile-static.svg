<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1174" viewBox="0 0 600 1174" role="img" aria-labelledby="profile-title profile-desc"><title id="profile-title">Abhishek Pundir — Software Engineer and AI Systems</title><desc id="profile-desc">Engineering console illustration showing an agent using tools, recording a trace, comparing a change and verifying behavior. A small illustrative log compares an argument with its baseline; it is not live telemetry.</desc><style>.profile-light{display:none}.profile-dark{display:inline}@media(prefers-color-scheme:light){.profile-light{display:inline}.profile-dark{display:none}}</style><g class="profile-dark" fill="none"><defs>
