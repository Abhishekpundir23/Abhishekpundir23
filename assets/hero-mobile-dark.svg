<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1174" viewBox="0 0 600 1174" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Abhishek Pundir — Software Engineer and AI Systems</title><desc id="desc">Engineering console illustration showing an agent using tools, recording a trace, comparing a change and verifying behavior. A small illustrative log compares an argument with its baseline; it is not live telemetry.</desc>
