<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Abhishek Pundir — Software Engineer and AI Systems</title><desc id="desc">Engineering console illustration showing an agent using tools, recording a trace, comparing a change and verifying behavior. A small illustrative log compares an argument with its baseline; it is not live telemetry.</desc>
<defs>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#142137" stroke-width=".7"/></pattern>
 <linearGradient id="edge" x1="0" y1="0" x2="1200" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#5ce1ff" stop-opacity=".6"/><stop offset=".5" stop-color="#24364e"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".45"/></linearGradient>
 <clipPath id="bounds"><rect x="1" y="1" width="1198" height="498" rx="22"/></clipPath>
</defs>
<style>
.signal {stroke-dasharray: 5 250; stroke-linecap: round; animation: stream 16s linear infinite;}
.signal.delayed {animation-delay:-8s;}
.node-pulse {animation: breathe 16s ease-in-out infinite;}
@keyframes stream {to {stroke-dashoffset:-510;}}
@keyframes breathe {0%,100% {opacity:.45} 50% {opacity:.9}}
@media (prefers-reduced-motion: reduce) {.signal,.node-pulse {animation:none !important;} .signal {stroke-dasharray:none;opacity:.45;}}
</style>
